<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Logo de Pescaclip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#d6246e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9ee"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- sedal -->
  <path d="M150 8 V40" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11" opacity="0.85"/>
  <!-- clip (botón de reproducir) colgando del anzuelo -->
  <rect x="52" y="122" width="152" height="100" rx="26" fill="url(#card)"/>
  <path d="M114 148 v48 l42 -24 z" fill="#e8384f"/>
  <!-- anzuelo: atraviesa el borde superior del clip -->
  <circle cx="150" cy="44" r="8" fill="none" stroke="#fff" stroke-width="6"/>
  <path d="M150 52 V118 a22 22 0 0 1 -44 0 V100" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  <path d="M100 104 l6 -20 l12 16 z" fill="#fff"/>
  <rect x="96" y="122" width="64" height="12" fill="url(#card)"/>
</svg>
